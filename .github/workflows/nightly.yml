# The property runs too long for the gate before a merge: docs/testing.md has what they measure.
name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  properties:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - name: Long property run at a random seed
        run: |
          seed=$((RANDOM * 32768 + RANDOM))
          echo "Replay with REEVE_PROPERTY_SEED=$seed"
          REEVE_PROPERTY_SEED=$seed pnpm test:properties
